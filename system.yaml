# PUM (Go) System Configuration

system:
  name: "Product Unit Management (Go)"
  version: "1.0.0-prototype"
  env: "development"

# Core Services - The app is blocked if any of these are offline
core_services:
  - registry
  - identity
  - product

# Optional Services - GUI shows them only if they register
optional_services:
  - inventory
  - network
  - task
  - external-modules
  - terminal
  - external-data

# External Module Configuration
# Modes available:
#   "mock"     - Internal Go code stub. No network calls are made. Logs payload and returns success immediately.
#   "emulated" - Connects to a standalone dummy service (e.g. a local mock Python server) running at the endpoint.
#   "real"     - Connects to the actual production or staging external service via 'real_endpoint'.
external_modules:
  ldap:
    mode: "mock"
    endpoint: "ldap://localhost:389"
    real_endpoint: "ldaps://ad.production.internal:636"
  glpi:
    mode: "mock"
    endpoint: "http://localhost:8080/glpi"
    real_endpoint: "https://glpi.production.internal/api/"
  zabbix:
    mode: "mock"
    endpoint: "http://localhost:8080/zabbix"
    real_endpoint: "https://zabbix.production.internal/api_jsonrpc.php"
  rabbitmq:
    mode: "mock"
    endpoint: "amqp://guest:guest@localhost:5672"
    real_endpoint: "amqps://produser:prodpass@mq.production.internal:5671"

# Service Discovery Settings
discovery:
  registry_url: "http://localhost:8088"
  heartbeat_interval: "30s"
  timeout: "60s"
