schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph

autobind:
  - pum-go/pkg/models

models:
  Switch:
    model: pum-go/pkg/models.Switch
  SwitchPort:
    model: pum-go/pkg/models.SwitchPort
