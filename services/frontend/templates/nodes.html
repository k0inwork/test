{{define "content"}}
<h1>Physical Nodes</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Region</th>
            <th>Type</th>
            <th>State</th>
            <th>Address</th>
        </tr>
    </thead>
    <tbody>
        {{range .Nodes}}
        <tr>
            <td>{{.Name}}</td>
            <td>{{.Region}}</td>
            <td>{{.PouType}}</td>
            <td>{{.State}}</td>
            <td>{{.Address}}</td>
        </tr>
        {{end}}
    </tbody>
</table>
<form action="/sync" method="POST">
    <button type="submit" class="btn btn-warning">Sync with GLPI</button>
</form>
{{end}}
