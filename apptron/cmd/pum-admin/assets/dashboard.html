<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PUM Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        h1 { color: #007acc; }
        .status-ok { color: #4caf50; }
    </style>
</head>
<body>
    <h1>PUM Admin Dashboard (Mock)</h1>
    <div class="card">
        <h2>Network Health</h2>
        <p>Status: <span class="status-ok">ONLINE</span></p>
        <p>Active Nodes: 42</p>
    </div>
    <div class="card">
        <h2>Recent Alerts</h2>
        <ul>
            <li>[INFO] Switch-01 configuration updated.</li>
            <li>[WARN] Gateway-B high latency detected.</li>
        </ul>
    </div>
</body>
</html>
