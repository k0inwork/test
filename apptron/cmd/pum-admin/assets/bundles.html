<html>
<script type="module">
import { getCachedOrFetch } from "/lib/apptron.js";

// prefetch/cache bundles
let loading = new Map();
[
    "/bundles/sys.tar.gz",
    // "/bundles/goroot.tar.br",
    // "/bundles/gocache-386.tar.br",
    // "/bundles/gocache-wasm.tar.br",
].forEach(async (name) => {
    loading.set(name, new Promise(async (resolve) => {
        const isGzip = name.endsWith(".gz");
        await getCachedOrFetch(name, isGzip, "bundles");
        resolve();
    }));
});

window.addEventListener("message", async (event) => {
    if (event.data.type !== "bundle") return;

    const res = loading.get(event.data.name);
    if (res) {
        await res;
        loading.delete(event.data.name);
    }

    const isGzip = event.data.name.endsWith(".gz");
    const buf = await getCachedOrFetch(event.data.name, isGzip, "bundles");
    event.data.port.postMessage({ bundle: buf }, [buf]);
});
</script>
</html>
