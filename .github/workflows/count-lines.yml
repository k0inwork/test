name: Count Lines
on: workflow_dispatch
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count all file lines
        run: |
          echo "=== Line Count Summary ==="
          git ls-files | while IFS= read -r file; do
            if [ -f "$file" ]; then
              wc -l "$file"
            fi
          done
          echo "=== Total Lines ==="
          git ls-files | xargs wc -l | tail -n 1
          echo "=== Done ===" 
