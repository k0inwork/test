
name: Count Lines
on: workflow_dispatch
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Count all lines
        run: |
          TOTAL=$(find . -type f -exec cat {} + 2>/dev/null | wc -l)
          echo "Total lines: $TOTAL"
          echo "$TOTAL" > line_count.txt
      - name: Also count with cloc for detail
        run: |
          sudo apt-get install -y cloc
          cloc . --quiet || true
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: line-count-result
          path: line_count.txt
