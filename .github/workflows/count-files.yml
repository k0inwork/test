name: Count Files
on:
  push: null
  workflow_dispatch: {}
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count all files
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: >
          echo "Fetching tree for k0inwork/test..."

          COUNT=$(gh api repos/k0inwork/test/git/trees/main?recursive=1 --jq
          '.tree[] | select(.type=="blob")' | wc -l)

          echo "FILE_COUNT=$COUNT"

          echo "::notice::FILE_COUNT=$COUNT"

          echo "Total file count: $COUNT"
