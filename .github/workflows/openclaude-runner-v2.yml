name: OpenClaude Task Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task prompt for OpenClaude'
        required: true
        type: string
      model:
        description: 'Model to use'
        required: false
        default: 'glm-5.1'
        type: string
      working_repo:
        description: 'Optional: repo to clone and work on (owner/repo)'
        required: false
        type: string
      branch:
        description: 'Branch to work on'
        required: false
        default: 'main'
        type: string

  push:
    paths:
      - 'tasks/pending/*.json'

jobs:
  run-openclaude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ANTHROPIC_BASE_URL: "https://api.z.ai/api/coding/paas/v4"
      ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine task source
        id: task_source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=dispatch" >> $GITHUB_OUTPUT
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
            echo "model=${{ inputs.model || 'glm-5.1' }}" >> $GITHUB_OUTPUT
            echo "working_repo=${{ inputs.working_repo }}" >> $GITHUB_OUTPUT
            echo "branch=${{ inputs.branch || 'main' }}" >> $GITHUB_OUTPUT
          else
            # Find the most recently added task file
            TASK_FILE=$(git diff --name-only HEAD~1 HEAD -- 'tasks/pending/*.json' | head -1)
            if [ -z "$TASK_FILE" ]; then
              echo "No new task file found"
              exit 0
            fi
            echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT
            echo "mode=file" >> $GITHUB_OUTPUT
            # Parse JSON task file
            echo "task=$(jq -r '.task' $TASK_FILE)" >> $GITHUB_OUTPUT
            echo "model=$(jq -r '.model // "glm-5.1"' $TASK_FILE)" >> $GITHUB_OUTPUT
            echo "working_repo=$(jq -r '.working_repo // ""' $TASK_FILE)" >> $GITHUB_OUTPUT
            echo "branch=$(jq -r '.branch // "main"' $TASK_FILE)" >> $GITHUB_OUTPUT
            echo "task_id=$(jq -r '.task_id // "unknown"' $TASK_FILE)" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install OpenClaude
        run: |
          npm install -g openclaude 2>/dev/null || {
            cd /tmp
            git clone https://github.com/Gitlawb/openclaude.git
            cd openclaude
            npm install
            npm link
          }

      - name: Clone working repo
        if: steps.task_source.outputs.working_repo != ''
        run: |
          git clone https://github.com/${{ steps.task_source.outputs.working_repo }}.git workspace
          cd workspace
          git checkout ${{ steps.task_source.outputs.branch }} || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure z.ai provider
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/.openclaude-profile.json << EOF
          {
            "provider": "openai-compatible",
            "name": "z.ai GLM",
            "model": "${{ steps.task_source.outputs.model }}",
            "base_url": "https://api.z.ai/api/coding/paas/v4",
            "api_key_env": "ZAI_API_KEY"
          }
          EOF
          export OPENCLAUDE_MODEL="${{ steps.task_source.outputs.model }}"

      - name: Run OpenClaude task
        id: run_task
        run: |
          WORKDIR="${{ steps.task_source.outputs.working_repo != '' && 'workspace' || '.' }}"
          cd "$WORKDIR"

          TASK="${{ steps.task_source.outputs.task }}"
          echo "Running task: $TASK"
          echo "Model: ${{ steps.task_source.outputs.model }}"

          echo "::group::OpenClaude Output"
          openclaude --print --prompt "$TASK" 2>&1 | tee /tmp/openclaude-output.txt || {
            echo "$TASK" | openclaude --no-interactive 2>&1 | tee /tmp/openclaude-output.txt || true
          }
          echo "::endgroup::"

      - name: Save result (file-triggered mode)
        if: steps.task_source.outputs.mode == 'file'
        run: |
          TASK_ID="${{ steps.task_source.outputs.task_id }}"
          TASK_FILE="${{ steps.task_source.outputs.task_file }}"

          mkdir -p tasks/completed
          jq --arg output "$(cat /tmp/openclaude-output.txt 2>/dev/null || echo 'No output')" \
             --arg status "completed" \
             --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '. + {output: $output, status: $status, completed_at: $completed_at}' \
             "$TASK_FILE" > "tasks/completed/${TASK_ID}.json"

          # Move from pending to completed
          git config user.name "OpenClaude Runner"
          git config user.email "openclaude@github.actions"
          git add tasks/completed/
          git rm "$TASK_FILE" || true
          git commit -m "Task ${TASK_ID}: completed" || true
          git push || true

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaude-output
          path: /tmp/openclaude-output.txt

      - name: Post output summary
        run: |
          echo "## OpenClaude Task Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** ${{ steps.task_source.outputs.model }}" >> $GITHUB_STEP_SUMMARY
          echo "**Task:** ${{ steps.task_source.outputs.task }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -200 /tmp/openclaude-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
