name: OpenClaude Task Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task prompt for OpenClaude'
        required: true
        type: string
      model:
        description: 'Model to use'
        required: false
        default: 'glm-5.1'
        type: string
      working_repo:
        description: 'Optional: repo to clone and work on (owner/repo)'
        required: false
        type: string
      branch:
        description: 'Branch to work on'
        required: false
        default: 'main'
        type: string

jobs:
  run-openclaude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      ANTHROPIC_BASE_URL: "https://api.z.ai/api/coding/paas/v4"
      ANTHROPIC_API_KEY: ${{ secrets.ZAI_API_KEY }}
      OPENCLAUDE_MODEL: ${{ inputs.model }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install OpenClaude
        run: |
          npm install -g openclaude 2>/dev/null || {
            cd /tmp
            git clone https://github.com/Gitlawb/openclaude.git
            cd openclaude
            npm install
            npm link
          }

      - name: Clone working repo
        if: inputs.working_repo != ''
        run: |
          git clone https://github.com/${{ inputs.working_repo }}.git workspace
          cd workspace
          git checkout ${{ inputs.branch }} || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure z.ai provider
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/.openclaude-profile.json << 'EOF'
          {
            "provider": "openai-compatible",
            "name": "z.ai GLM",
            "model": "${{ inputs.model }}",
            "base_url": "https://api.z.ai/api/coding/paas/v4",
            "api_key_env": "ZAI_API_KEY"
          }
          EOF

      - name: Run OpenClaude task
        id: task
        run: |
          WORKDIR="${{ inputs.working_repo != '' && 'workspace' || '.' }}"
          cd "$WORKDIR"
          
          echo "::group::OpenClaude Output"
          openclaude --print --prompt "${{ inputs.task }}" 2>&1 | tee /tmp/openclaude-output.txt || {
            echo "${{ inputs.task }}" | openclaude --no-interactive 2>&1 | tee /tmp/openclaude-output.txt || true
          }
          echo "::endgroup::"

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaude-output
          path: |
            /tmp/openclaude-output.txt
            workspace/

      - name: Post output summary
        run: |
          echo "## OpenClaude Task Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** ${{ inputs.model }}" >> $GITHUB_STEP_SUMMARY
          echo "**Task:** ${{ inputs.task }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/openclaude-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
