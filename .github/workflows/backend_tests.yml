name: Backend and UI Tests

on:
  push:
    branches:
      - master
      - development
      - merge-day-consolidation
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    branches:
      - master
      - development
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/**'
      - '.github/workflows/backend_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Dependencies
        run: go mod download

      - name: Install Frontend Test Dependencies
        run: |
          cd e2e_tests
          npm install
          npx playwright install chromium --with-deps

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y wget tar curl
          go install github.com/mattn/goreman@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Unit Tests
        run: |
          services=(
            "external-data"
            "external-modules"
            "frontend"
            "identity"
            "inventory"
            "network"
            "product"
            "registry"
            "task"
            "terminal"
            "keyservice"
            "compatibility"
          )
          for service in "${services[@]}"; do
            echo "Testing services/$service..."
            (cd "services/$service" && go test ./...)
          done

      - name: Run Integration Tests
        env:
          CI: true
        run: |
          ./start.sh > all_services.log 2>&1 &

          echo "Waiting for registry..."
          MAX_RETRIES=90
          RETRY_COUNT=0
          until curl -s http://localhost:8088/discovery > /dev/null || [ $RETRY_COUNT -eq $MAX_RETRIES ]; do
            sleep 1
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo -n "."
          done

          if ! curl -s http://localhost:8088/discovery > /dev/null; then
             echo "Registry failed to start"
             cat all_services.log
             false
          fi

          echo "Registry is UP"
          sleep 20
          go test -v ./e2e_tests/backend_integration/...

      - name: Run UI Tests
        run: |
          cd e2e_tests
          npx playwright test frontend_menu.spec.js

      - name: Archive logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            *.log
            services/**/*.log
            e2e_tests/test-results/
