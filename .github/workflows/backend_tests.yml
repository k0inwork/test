name: Backend Tests (Generated)

on:
  push:
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/backend_integration/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/backend_integration/**'
      - '.github/workflows/backend_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Skip External Dependencies
        run: echo "Skipping Prometheus and Jaeger as requested for basic backend tests."

      - name: Run Unit Tests
        run: |
          echo "Testing services/external-data..."
          (cd services/external-data && go test ./...)
          echo "Testing services/external-modules..."
          (cd services/external-modules && go test ./...)
          echo "Testing services/frontend..."
          (cd services/frontend && go test ./...)
          echo "Testing services/identity..."
          (cd services/identity && go test ./...)
          echo "Testing services/inventory..."
          (cd services/inventory && go test ./...)
          echo "Testing services/network..."
          (cd services/network && go test ./...)
          echo "Testing services/product..."
          (cd services/product && go test ./...)
          echo "Testing services/registry..."
          (cd services/registry && go test ./...)
          echo "Testing services/task..."
          (cd services/task && go test ./...)
          echo "Testing services/terminal..."
          (cd services/terminal && go test ./...)

      - name: Run Integration Tests
        run: |
          go test ./e2e_tests/backend_integration/...
