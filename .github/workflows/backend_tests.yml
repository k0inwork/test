name: Backend and UI Tests

on:
  push:
    branches:
      - master
      - development
      - merge-day-consolidation
    paths:
      - 'services/**'
      - 'pkg/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    branches:
      - master
      - development
    paths:
      - 'services/**'
      - 'pkg/**'
      - '.github/workflows/backend_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Dependencies
        run: go mod download

      - name: Install Frontend Test Dependencies
        run: |
          cd services/frontend/ui_tests
          npm install
          npx playwright install chromium --with-deps

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y wget tar curl
          go install github.com/mattn/goreman@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Unit Tests
        run: |
          services=(
            "external-data"
            "external-modules"
            "frontend"
            "identity"
            "inventory"
            "network"
            "product"
            "registry"
            "task"
            "terminal"
            "keyservice"
            "compatibility"
          )
          for service in "${services[@]}"; do
            echo "Testing services/$service..."
            (cd "services/$service" && go test ./...)
          done

      - name: Run Integration Tests
        env:
          CI: true
