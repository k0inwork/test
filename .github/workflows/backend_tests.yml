name: Backend Tests (Standard)

on:
  push:
    branches:
      - master
      - development
      - merge-day
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/backend_integration/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    branches:
      - master
      - development
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'e2e_tests/backend_integration/**'
      - '.github/workflows/backend_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: |
          services=("external-data" "external-modules" "frontend" "identity" "inventory" "network" "product" "registry" "task" "terminal")
          for s in "${services[@]}"; do
            echo "Testing services/$s..."
            (cd "services/$s" && go test ./...)
          done

      - name: Run Integration Tests
        run: |
          CI=true go test -v ./e2e_tests/backend_integration/...
